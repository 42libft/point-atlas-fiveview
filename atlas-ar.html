<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<title>Point Atlas Fiveview / AR出力</title></head><body><div id="ar-stage"></div><main class="ar-page" id="gate"><h1>Point Atlas Fiveview / AR出力</h1><p>プロジェクトを画像ターゲットへ固定します。 <a href="./index.html#ar-guide">手順を見る</a></p><p id="project-status"></p><p><label>プロジェクトJSON <input type="file" id="project" accept=".json"></label></p><p><label>認識する画像 <input type="file" id="target" accept="image/png,image/jpeg,image/webp"></label></p><p><label>保存したターゲット .mind <input type="file" id="mind-file" accept=".mind"></label></p><p class="sub">模様や細部を持つ平らな画像を選び、同じ画像を印刷または別画面に表示します。単純な輪や一文字だけでは認識しにくくなります。</p><button id="sample">自作ターゲットを使う</button> <button id="save-image" disabled>認識画像を保存</button> <button id="compile">ターゲットを生成</button><p id="status" role="status"></p><img id="target-preview" alt="ターゲット画像" style="max-width:240px;max-height:240px;display:block;margin:15px 0"><p><button id="save-target" disabled>ターゲットを保存</button> <button id="start" disabled>ARを始める</button> <button id="pose" disabled>カメラなしで姿勢確認</button></p><p class="sub">画像解析もカメラ処理もこの端末で行います。HTTPSまたはlocalhostが必要です。実機での認識・熱・5分性能は未検証です。</p><a href="./atlas.html" style="color:#d7bf8f">制作画面へ戻る</a></main><div id="overlay" class="ar-overlay hidden"><span id="tracking">画像を探しています</span> <button id="stop">終了</button></div><script type="module" src="./src/prototype/ar.ts"></script></body></html>
